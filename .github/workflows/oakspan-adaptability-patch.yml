name: Oakspan adaptability patch

on:
  push:
    paths:
      - '.github/workflows/oakspan-adaptability-patch.yml'

permissions:
  contents: write

jobs:
  patch-oakspan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python tools/patch_oakspan_adaptability.py
      - run: |
          if git diff --quiet -- projects/oakspan/index.html; then
            echo "No case-study changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/oakspan/index.html
          git commit -m "Position Oakspan as adaptable local-service architecture"
          git push origin HEAD:main
